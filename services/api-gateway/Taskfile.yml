# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  run:
    cmds:
      - go run ./cmd/api-gateway/main.go

  run-dev:
    cmds:
      - task: run

  build:
    cmds:
      - go build -o bin/ ./cmd/api-gateway/main.go

  goose-create:*:
    vars:
      NAME: '{{index .MATCH 0}}'
    cmds:
      - goose create -dir ./sql/migrations {{.NAME}} sql

  goose-up:
    desc: "goose up migrations"
    dotenv: ['.env']
    cmds:
      - goose -dir ./sql/migrations postgres "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable" up

  goose-down:
    desc: "goose down migrations"
    dotenv: ['.env']
    cmds:
      - goose -dir ./sql/migrations down

  sqlc:
    cmds:
      - sqlc generate

  grpc-gen:
    cmds:
    - >
        protoc
        -I=../../api/proto
        --go_out=internal/grpc
        --go_opt=paths=source_relative
        --go-grpc_out=internal/grpc
        --go-grpc_opt=paths=source_relative
        ../../api/proto/identity/v1/*.proto
    - >
        protoc
        -I=../../api/proto
        --go_out=internal/grpc
        --go_opt=paths=source_relative
        --go-grpc_out=internal/grpc
        --go-grpc_opt=paths=source_relative
        ../../api/proto/catalog/v1/*.proto

  swagger-gen:
    desc: Generate Swagger docs
    cmds:
      - swag init -g ./main.go --output ./internal/swagger --dir ./cmd/api-gateway,./internal/api --parseInternal --parseDependency

  test:
    cmds:
      - go test ./...

  fmt:
    desc: Format Go files
    cmds:
      - goimports -w -local api-gateway/ .
      - gofmt -w .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  check:
    desc: Run all checks
    deps: [fmt, vet, lint]

  pre-commit:
    desc: Run pre-commit checks
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - git add -u
