name: identity golangci lint
on:
  push:
    branches:
      - main
    paths:
      - 'services/identity/**'

  pull_request:
    branches:
      - main
    paths:
      - 'services/identity/**'

permissions:
  contents: read
  # Optional: allow read access to pull requests. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./services/identity

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
